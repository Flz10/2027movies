<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎬 The Great Movie Marathon — 2027</title>

<style>
:root {
    --bg: #070b14;
    --bg2: #0d1422;
    --card: #111a2a;
    --card2: #172238;
    --gold: #d8b45a;
    --gold2: #f2d98b;
    --text: #f5eddf;
    --muted: #9ca8bb;
    --line: #27344b;
    --green: #79d6a3;
    --red: #c96b6b;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% -10%, #263957 0%, transparent 42%),
        linear-gradient(180deg, #080d18 0%, #050810 100%);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    text-align: center;
    padding: 55px 20px 40px;
    border-bottom: 1px solid var(--line);
    position: relative;
    overflow: hidden;
}

header::before {
    content: "✦";
    position: absolute;
    left: 10%;
    top: 35px;
    color: var(--gold);
    opacity: .35;
    font-size: 30px;
}

header::after {
    content: "✦";
    position: absolute;
    right: 10%;
    top: 65px;
    color: var(--gold);
    opacity: .25;
    font-size: 20px;
}

.eyebrow {
    color: var(--gold);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 5px;
}

.title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(38px, 7vw, 78px);
    line-height: 1;
    margin: 18px 0 12px;
    text-shadow: 0 0 30px rgba(216,180,90,.15);
}

.subtitle {
    color: var(--muted);
    font-size: 15px;
}

/* =========================
   MAIN
========================= */

main {
    width: min(1180px, calc(100% - 30px));
    margin: auto;
    padding: 30px 0 80px;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 20px;
}

.stat {
    background: linear-gradient(145deg, var(--card2), var(--card));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,.2);
}

.stat-number {
    display: block;
    color: var(--gold);
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 5px;
}

.stat-label {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 2px;
}

/* =========================
   PROGRESS
========================= */

.progress-wrapper {
    margin: 20px 0 35px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 8px;
}

.progress {
    height: 11px;
    background: #202b3d;
    border-radius: 100px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(
        90deg,
        var(--gold),
        var(--gold2)
    );
    border-radius: 100px;
    transition: width .5s ease;
    box-shadow: 0 0 15px rgba(216,180,90,.3);
}

/* =========================
   MONTH
========================= */

.month-title {
    margin: 42px 0 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    color: var(--gold);
    font-family: Georgia, serif;
    font-size: 25px;
}

/* =========================
   MOVIE ROW
========================= */

.movie {
    display: grid;
    grid-template-columns: 45px 105px 1fr 70px;
    gap: 12px;
    align-items: center;

    background: rgba(17,26,42,.92);
    border: 1px solid var(--line);
    border-radius: 13px;

    padding: 12px 15px;
    margin: 7px 0;

    transition:
        transform .15s ease,
        border-color .15s ease,
        opacity .2s ease;
}

.movie:hover {
    transform: translateY(-2px);
    border-color: #435575;
}

.movie.watched {
    opacity: .55;
    background: rgba(14,29,24,.9);
}

.movie.watched .movie-title {
    text-decoration: line-through;
}

/* =========================
   CHECKBOX
========================= */

.checkbox {
    width: 23px;
    height: 23px;
    cursor: pointer;
    accent-color: var(--gold);
}

/* =========================
   DATE
========================= */

.date {
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
}

/* =========================
   MOVIE INFO
========================= */

.franchise {
    color: var(--gold);
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.movie-title {
    color: var(--text);
    font-weight: 600;
    font-size: 15px;
    margin-top: 4px;
}

/* =========================
   RATING
========================= */

.rating {
    width: 65px;
    background: #080e19;
    border: 1px solid var(--line);
    border-radius: 8px;

    padding: 7px;

    color: var(--text);
    text-align: center;

    outline: none;
}

.rating:focus {
    border-color: var(--gold);
}

.rating::placeholder {
    color: #66738a;
}

/* =========================
   BUTTON
========================= */

.reset {
    display: block;

    margin: 40px auto 0;

    background: transparent;
    color: var(--muted);

    border: 1px solid var(--line);
    border-radius: 8px;

    padding: 9px 16px;

    cursor: pointer;
}

.reset:hover {
    color: var(--text);
    border-color: var(--gold);
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    color: var(--muted);
    padding: 25px;
    border-top: 1px solid var(--line);
    font-size: 13px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .movie {
        grid-template-columns: 35px 75px 1fr;
    }

    .rating {
        display: none;
    }

    .date {
        font-size: 11px;
    }

    .movie-title {
        font-size: 14px;
    }
}
</style>
</head>

<script>

/* =========================================================

const movies = [

["2027-07-01","Harry Potter","Harry Potter and the Philosopher's Stone"],

["2027-07-08","Harry Potter","Harry Potter and the Deathly Hallows – Part 2"],

/* LORD OF THE RINGS */

["2027-07-09","The Lord of the Rings / Hobbit","The Fellowship of the Ring"],
["2027-07-10","The Lord of the Rings / Hobbit","The Two Towers"],
["2027-07-11","The Lord of the Rings / Hobbit","The Return of the King"],
["2027-07-12","The Lord of the Rings / Hobbit","An Unexpected Journey"],
["2027-07-13","The Lord of the Rings / Hobbit","The Desolation of Smaug"],
["2027-07-14","The Lord of the Rings / Hobbit","The Battle of the Five Armies"],

/* TRANSFORMERS */

["2027-07-15","Transformers","Transformers"],
["2027-07-16","Transformers","Revenge of the Fallen"],
["2027-07-17","Transformers","Dark of the Moon"],
["2027-07-18","Transformers","Age of Extinction"],
["2027-07-19","Transformers","The Last Knight"],
["2027-07-20","Transformers","Bumblebee"],
["2027-07-21","Transformers","Rise of the Beasts"]

];


/* =========================================================
   FILL EVERY REMAINING DATE UNTIL AUGUST 14
========================================================= */

const start = new Date("2027-04-14T00:00:00");
const end = new Date("2027-08-14T00:00:00");

const existingDates = new Set(
    movies.map(movie => movie[0])
);

for (
    let d = new Date(start);
    d <= end;
    d.setDate(d.getDate() + 1)
) {

    const dateString =
        d.toISOString().slice(0,10);

    if (!existingDates.has(dateString)) {

        movies.push([
            dateString,
            "Wildcard",
            "Free Pick / Catch-up"
        ]);

    }
}


/* =========================================================
   SORT BY DATE
========================================================= */

movies.sort(
    (a,b) =>
        new Date(a[0]) - new Date(b[0])
);


/* =========================================================
   STORAGE
========================================================= */

function watchedKey(index) {
    return "movie2027_watched_" + index;
}

function ratingKey(index) {
    return "movie2027_rating_" + index;
}


/* =========================================================
   SOUND ENGINE
========================================================= */

/*
    These are synthesized sounds.
    No external audio files are required.

    Each franchise gets its own sound character.
*/

const soundProfiles = {

    "Star Wars": {
        type: "saber"
    },

    "Transformers": {
        type: "metal"
    },

    "Back to the Future": {
        type: "time"
    },

    "Indiana Jones": {
        type: "whip"
    },

    "Pirates of the Caribbean": {
        type: "pirate"
    },

    "Men in Black": {
        type: "scifi"
    },

    "Planet of the Apes": {
        type: "ape"
    },

    "MCU": {
        type: "hero"
    },

    "Pixar": {
        type: "magic"
    },

    "Harry Potter": {
        type: "magic"
    },

    "The Lord of the Rings / Hobbit": {
        type: "epic"
    },

    "Wildcard": {
        type: "magic"
    }

};


/* =========================================================
   AUDIO
========================================================= */

function playSound(franchise) {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) return;

        const ctx = new AudioContext();

        const profile =
            soundProfiles[franchise]?.type || "magic";


        /* STAR WARS — LIGHTSABER */

        if (profile === "saber") {

            const osc =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            osc.type = "sawtooth";

            osc.frequency.setValueAtTime(
                120,
                ctx.currentTime
            );

            osc.frequency.exponentialRampToValueAtTime(
                850,
                ctx.currentTime + .22
            );

            osc.frequency.exponentialRampToValueAtTime(
                240,
                ctx.currentTime + .5
            );

            gain.gain.setValueAtTime(
                .001,
                ctx.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                .2,
                ctx.currentTime + .03
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                ctx.currentTime + .55
            );

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + .56);

            return;
        }


        /* TRANSFORMERS — METAL */

        if (profile === "metal") {

            const osc =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            osc.type = "square";

            osc.frequency.setValueAtTime(
                90,
                ctx.currentTime
            );

            osc.frequency.exponentialRampToValueAtTime(
                35,
                ctx.currentTime + .35
            );

            gain.gain.setValueAtTime(
                .001,
                ctx.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                .18,
                ctx.currentTime + .01
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                ctx.currentTime + .4
            );

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + .42);

            return;
        }


        /* TIME MACHINE */

        if (profile === "time") {

            playSequence(
                ctx,
                [220,330,440,660],
                .12
            );

            return;
        }


        /* WHIP */

        if (profile === "whip") {

            playSequence(
                ctx,
                [900,300,120],
                .08
            );

            return;
        }


        /* PIRATES */

        if (profile === "pirate") {

            playSequence(
                ctx,
                [220,330,440,330],
                .16
            );

            return;
        }


        /* MEN IN BLACK */

        if (profile === "scifi") {

            playSequence(
                ctx,
                [700,500,800],
                .11
            );

            return;
        }


        /* APES */

        if (profile === "ape") {

            playSequence(
                ctx,
                [120,100,80],
                .18
            );

            return;
        }


        /* MCU */

        if (profile === "hero") {

            playSequence(
                ctx,
                [261,329,392,523],
                .12
            );

            return;
        }


        /* MAGIC / PIXAR / HARRY POTTER */

        if (profile === "magic") {

            playSequence(
                ctx,
                [523,659,784,1046],
                .10
            );

            return;
        }


        /* LOTR */

        if (profile === "epic") {

            playSequence(
                ctx,
                [196,247,294,392],
                .18
            );

            return;
        }

    }

    catch (error) {

        console.log(
            "Audio unavailable:",
            error
        );

    }

}


/* =========================================================
   SOUND SEQUENCE
========================================================= */

function playSequence(
    ctx,
    frequencies,
    duration
) {

    frequencies.forEach(
        (frequency,index) => {

            const osc =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            const start =
                ctx.currentTime +
                index * duration;

            osc.type = "sine";

            osc.frequency.value =
                frequency;

            gain.gain.setValueAtTime(
                .001,
                start
            );

            gain.gain.exponentialRampToValueAtTime(
                .14,
                start + .015
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                start + duration
            );

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(start);

            osc.stop(
                start + duration
            );

        }
    );

}


/* =========================================================
   RENDER
========================================================= */

function renderSchedule() {

    const container =
        document.getElementById("schedule");

    container.innerHTML = "";

    let currentMonth = "";


    movies.forEach(
        (movie,index) => {

            const date =
                new Date(movie[0] + "T00:00:00");

            const monthName =
                date.toLocaleString(
                    "en-US",
                    {
                        month:"long",
                        year:"numeric"
                    }
                );


            /* MONTH HEADER */

            if (monthName !== currentMonth) {

                currentMonth =
                    monthName;

                const heading =
                    document.createElement("h2");

                heading.className =
                    "month-title";

                heading.textContent =
                    monthName;

                container.appendChild(
                    heading
                );

            }


            /* MOVIE ROW */

            const row =
                document.createElement("div");

            row.className =
                "movie";


            const watched =
                localStorage.getItem(
                    watchedKey(index)
                ) === "true";


            if (watched) {

                row.classList.add(
                    "watched"
                );

            }


            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.className =
                "checkbox";

            checkbox.checked =
                watched;


            const dateElement =
                document.createElement(
                    "div"
                );

            dateElement.className =
                "date";

            dateElement.textContent =
                date.toLocaleDateString(
                    "en-US",
                    {
                        weekday:"short",
                        day:"2-digit",
                        month:"short"
                    }
                );


            const info =
                document.createElement(
                    "div"
                );


            const franchise =
                document.createElement(
                    "div"
                );

            franchise.className =
                "franchise";

            franchise.textContent =
                movie[1];


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "movie-title";

            title.textContent =
                movie[2];


            info.appendChild(
                franchise
            );

            info.appendChild(
                title
            );


            const rating =
                document.createElement(
                    "input"
                );

            rating.type =
                "number";

            rating.className =
                "rating";

            rating.min = "0";

            rating.max = "10";

            rating.step = ".1";

            rating.placeholder =
                "/10";

            rating.value =
                localStorage.getItem(
                    ratingKey(index)
                ) || "";


            /* CHECKBOX EVENT */

            checkbox.addEventListener(
                "change",
                function() {

                    if (this.checked) {

                        localStorage.setItem(
                            watchedKey(index),
                            "true"
                        );

                        playSound(
                            movie[1]
                        );

                    }

                    else {

                        localStorage.removeItem(
                            watchedKey(index)
                        );

                    }

                    renderSchedule();

                }
            );


            /* RATING EVENT */

            rating.addEventListener(
                "change",
                function() {

                    if (
                        this.value !== ""
                    ) {

                        localStorage.setItem(
                            ratingKey(index),
                            this.value
                        );

                    }

                    else {

                        localStorage.removeItem(
                            ratingKey(index)
                        );

                    }

                    updateStats();

                }
            );


            row.appendChild(
                checkbox
            );

            row.appendChild(
                dateElement
            );

            row.appendChild(
                info
            );

            row.appendChild(
                rating
            );


            container.appendChild(
                row
            );

        }
    );


    updateStats();

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

    let watched = 0;

    let ratings = [];


    movies.forEach(
        (_,index) => {

            if (
                localStorage.getItem(
                    watchedKey(index)
                ) === "true"
            ) {

                watched++;

            }


            const rating =
                parseFloat(
                    localStorage.getItem(
                        ratingKey(index)
                    )
                );


            if (
                !isNaN(rating)
            ) {

                ratings.push(
                    rating
                );

            }

        }
    );


    const total =
        movies.length;


    const percentage =
        Math.round(
            watched / total * 100
        );


    let average = "—";


    if (ratings.length > 0) {

        const sum =
            ratings.reduce(
                (a,b) => a + b,
                0
            );

        average =
            (
                sum / ratings.length
            ).toFixed(1) + " / 10";

    }


    document.getElementById(
        "watchedCount"
    ).textContent =
        watched + " / " + total;


    document.getElementById(
        "percentage"
    ).textContent =
        percentage + "%";


    document.getElementById(
        "average"
    ).textContent =
        average;


    document.getElementById(
        "progressText"
    ).textContent =
        watched + " / " + total;


    document.getElementById(
        "progressBar"
    ).style.width =
        percentage + "%";

}


/* =========================================================
   RESET
========================================================= */

function resetProgress() {

    const confirmation =
        confirm(
            "Are you sure you want to reset your entire movie marathon?"
        );


    if (!confirmation) {
        return;
    }


    movies.forEach(
        (_,index) => {

            localStorage.removeItem(
                watchedKey(index)
            );

            localStorage.removeItem(
                ratingKey(index)
            );

        }
    );


    renderSchedule();

}


/* =========================================================
   START
========================================================= */

renderSchedule();

</script>
