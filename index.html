<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎬 The Great Movie Marathon — 2027</title>

<style>
:root {
    --bg: #05070c;
    --bg2: #0b1019;
    --text: #f5f0e6;
    --muted: #929bad;
    --gold: #d8b45a;
    --line: #252e3e;
    --card: #0e1522;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 50% -10%, #1b2940 0%, transparent 40%),
        linear-gradient(180deg, #070a11 0%, #03050a 100%);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================================
   HEADER
========================================= */

header {
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 65px 20px 50px;
    border-bottom: 1px solid var(--line);
}

header:before {
    content: "✦";
    position: absolute;
    left: 12%;
    top: 50px;
    color: #d8b45a;
    opacity: .25;
    font-size: 28px;
}

header:after {
    content: "✦";
    position: absolute;
    right: 12%;
    top: 80px;
    color: #d8b45a;
    opacity: .2;
    font-size: 20px;
}

.eyebrow {
    color: var(--gold);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 5px;
}

h1 {
    margin: 18px 0 12px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(40px, 7vw, 78px);
    line-height: .95;
}

.subtitle {
    color: var(--muted);
    font-size: 15px;
}

/* =========================================
   MAIN
========================================= */

main {
    width: min(1150px, calc(100% - 30px));
    margin: auto;
    padding: 30px 0 80px;
}

/* =========================================
   STATS
========================================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

.stat {
    padding: 20px;
    text-align: center;
    background: linear-gradient(145deg, #111a2a, #0b111c);
    border: 1px solid var(--line);
    border-radius: 18px;
}

.stat-number {
    display: block;
    color: var(--gold);
    font-size: 26px;
    font-weight: bold;
}

.stat-label {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 2px;
}

/* =========================================
   PROGRESS
========================================= */

.progress-wrap {
    margin: 22px 0 40px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 8px;
}

.progress {
    height: 11px;
    overflow: hidden;
    border-radius: 100px;
    background: #202938;
}

.progress-bar {
    width: 0%;
    height: 100%;
    border-radius: 100px;
    background: linear-gradient(
        90deg,
        #b78e39,
        #f2d98b
    );
    transition: width .5s ease;
}

/* =========================================
   MONTH BLOCK
========================================= */

.month-block {
    margin: 35px 0;
    padding: 25px;
    background:
        linear-gradient(
            145deg,
            rgba(18,25,38,.95),
            rgba(7,11,18,.95)
        );
    border: 1px solid #293346;
    border-radius: 24px;
    box-shadow: 0 15px 50px rgba(0,0,0,.25);
}

.month-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.month-name {
    margin: 0;
    font-family: Georgia, serif;
    font-size: 31px;
}

.month-count {
    color: var(--muted);
    font-size: 12px;
}

/* =========================================
   FRANCHISE BLOCK
========================================= */

.franchise-block {
    margin: 16px 0;
    overflow: hidden;

    border: 1px solid var(--franchise-border);
    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            var(--franchise-bg),
            rgba(5,8,13,.95)
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04),
        0 8px 30px rgba(0,0,0,.15);
}

.franchise-header {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 15px 18px;

    border-bottom: 1px solid var(--franchise-border);

    background:
        linear-gradient(
            90deg,
            var(--franchise-accent-soft),
            transparent
        );
}

.franchise-icon {
    width: 35px;
    height: 35px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: var(--franchise-accent-soft);
    color: var(--franchise-accent);

    font-size: 18px;
}

.franchise-name {
    color: var(--franchise-accent);
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.franchise-films {
    color: var(--muted);
    margin-left: auto;
    font-size: 11px;
}

/* =========================================
   MOVIE
========================================= */

.movie {
    display: grid;
    grid-template-columns: 42px 105px 1fr 70px;
    align-items: center;
    gap: 12px;

    padding: 12px 15px;

    border-bottom: 1px solid rgba(255,255,255,.045);

    transition:
        background .15s ease,
        transform .15s ease;
}

.movie:last-child {
    border-bottom: none;
}

.movie:hover {
    background: rgba(255,255,255,.035);
}

.movie.watched {
    opacity: .48;
}

.movie.watched .movie-title {
    text-decoration: line-through;
}

/* =========================================
   CHECKBOX
========================================= */

.checkbox {
    width: 22px;
    height: 22px;

    cursor: pointer;

    accent-color: var(--franchise-accent);
}

/* =========================================
   DATE
========================================= */

.date {
    color: var(--muted);
    font-size: 12px;
}

/* =========================================
   TITLE
========================================= */

.movie-title {
    font-size: 15px;
    font-weight: 650;
}

/* =========================================
   RATING
========================================= */

.rating {
    width: 62px;

    padding: 7px;

    color: var(--text);
    text-align: center;

    background: rgba(0,0,0,.35);
    border: 1px solid var(--franchise-border);
    border-radius: 8px;

    outline: none;
}

.rating:focus {
    border-color: var(--franchise-accent);
}

.rating::placeholder {
    color: #657085;
}

/* =========================================
   RESET
========================================= */

.reset {
    display: block;

    margin: 45px auto 0;

    padding: 10px 18px;

    color: var(--muted);
    background: transparent;

    border: 1px solid var(--line);
    border-radius: 9px;

    cursor: pointer;
}

.reset:hover {
    color: white;
    border-color: var(--gold);
}

/* =========================================
   FOOTER
========================================= */

footer {
    padding: 30px;
    text-align: center;

    color: var(--muted);

    border-top: 1px solid var(--line);

    font-size: 13px;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    main {
        width: calc(100% - 18px);
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .month-block {
        padding: 15px;
    }

    .month-header {
        align-items: flex-start;
    }

    .month-name {
        font-size: 25px;
    }

    .movie {
        grid-template-columns: 32px 70px 1fr;
    }

    .rating {
        display: none;
    }

    .date {
        font-size: 10px;
    }

    .movie-title {
        font-size: 13px;
    }
}
</style>

function playSound(franchise) {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) return;

        const ctx = new AudioContext();

        const sounds = {

            "Star Wars": [110,220,440,880],

            "Transformers": [90,65,120],

            "Back to the Future": [220,330,440,660],

            "Planet of the Apes": [100,80,65],

            "Men in Black": [700,500,800],

            "Pirates of the Caribbean": [220,330,440,330],

            "Pixar": [523,659,784,1046],

            "MCU": [261,329,392,523],

            "Harry Potter": [523,659,784,1046],

            "The Hobbit": [196,247,294,392],

            "The Lord of the Rings": [147,196,247,294,392],

            "Top Gun": [196,247,330,392],

            "Maze Runner": [140,180,230],

            "The Hunger Games": [220,277,330,440],

            "Twilight": [196,247,294,370],

            "Wildcard": [440,660,880]

        };

        const frequencies =
            sounds[franchise] ||
            sounds["Wildcard"];

        frequencies.forEach(
            (frequency,index) => {

                const oscillator =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();

                const start =
                    ctx.currentTime +
                    index * .10;

                oscillator.type =
                    franchise === "Star Wars"
                        ? "sawtooth"
                        : "sine";

                oscillator.frequency.value =
                    frequency;

                gain.gain.setValueAtTime(
                    .001,
                    start
                );

                gain.gain.exponentialRampToValueAtTime(
                    .12,
                    start + .015
                );

                gain.gain.exponentialRampToValueAtTime(
                    .001,
                    start + .11
                );

                oscillator.connect(gain);
                gain.connect(ctx.destination);

                oscillator.start(start);

                oscillator.stop(
                    start + .12
                );

            }
        );

    }

    catch (e) {
        console.log("Audio unavailable");
    }

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    const container =
        document.getElementById("schedule");

    container.innerHTML = "";

    let currentMonth = "";

    let monthBlock = null;

    let franchiseBlock = null;

    let currentFranchise = "";


    movies.forEach(
        (movie,index) => {

            const date =
                new Date(
                    movie[0] + "T00:00:00"
                );

            const month =
                date.toLocaleString(
                    "en-US",
                    {
                        month:"long",
                        year:"numeric"
                    }
                );


            /* NEW MONTH */

            if (month !== currentMonth) {

                currentMonth = month;

                monthBlock =
                    document.createElement(
                        "section"
                    );

                monthBlock.className =
                    "month-block";


                const monthHeader =
                    document.createElement(
                        "div"
                    );

                monthHeader.className =
                    "month-header";


                const monthName =
                    document.createElement(
                        "h2"
                    );

                monthName.className =
                    "month-name";

                monthName.textContent =
                    month;


                const monthCount =
                    document.createElement(
                        "span"
                    );

                monthCount.className =
                    "month-count";

                monthCount.textContent =
                    "MOVIE MONTH";


                monthHeader.appendChild(
                    monthName
                );

                monthHeader.appendChild(
                    monthCount
                );

                monthBlock.appendChild(
                    monthHeader
                );

                container.appendChild(
                    monthBlock
                );

                currentFranchise = "";
            }


            /* NEW FRANCHISE */

            if (movie[1] !== currentFranchise) {

                currentFranchise =
                    movie[1];

                const style =
                    franchiseStyles[
                        movie[1]
                    ] ||
                    franchiseStyles.Wildcard;


                franchiseBlock =
                    document.createElement(
                        "div"
                    );

                franchiseBlock.className =
                    "franchise-block";


                franchiseBlock.style.setProperty(
                    "--franchise-accent",
                    style.accent
                );

                franchiseBlock.style.setProperty(
                    "--franchise-bg",
                    style.bg
                );

                franchiseBlock.style.setProperty(
                    "--franchise-accent-soft",
                    style.soft
                );

                franchiseBlock.style.setProperty(
                    "--franchise-border",
                    style.border
                );


                const franchiseHeader =
                    document.createElement(
                        "div"
                    );

                franchiseHeader.className =
                    "franchise-header";


                const icon =
                    document.createElement(
                        "div"
                    );

                icon.className =
                    "franchise-icon";

                icon.textContent =
                    style.icon;


                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "franchise-name";

                name.textContent =
                    movie[1];


                const count =
                    document.createElement(
                        "div"
                    );

                count.className =
                    "franchise-films";

                count.textContent =
                    "FILMS";


                franchiseHeader.appendChild(
                    icon
                );

                franchiseHeader.appendChild(
                    name
                );

                franchiseHeader.appendChild(
                    count
                );


                franchiseBlock.appendChild(
                    franchiseHeader
                );

                monthBlock.appendChild(
                    franchiseBlock
                );

            }


            /* MOVIE ROW */

            const watched =
                localStorage.getItem(
                    watchedKey(index)
                ) === "true";


            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "movie";


            if (watched) {

                row.classList.add(
                    "watched"
                );

            }


            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.className =
                "checkbox";

            checkbox.checked =
                watched;


            const dateElement =
                document.createElement(
                    "div"
                );

            dateElement.className =
                "date";

            dateElement.textContent =
                date.toLocaleDateString(
                    "en-US",
                    {
                        weekday:"short",
                        day:"2-digit",
                        month:"short"
                    }
                );


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "movie-title";

            title.textContent =
                movie[2];


            const rating =
                document.createElement(
                    "input"
                );

            rating.type =
                "number";

            rating.className =
                "rating";

            rating.min =
                "0";

            rating.max =
                "10";

            rating.step =
                ".1";

            rating.placeholder =
                "/10";

            rating.value =
                localStorage.getItem(
                    ratingKey(index)
                ) || "";


            /* CHECKBOX */

            checkbox.addEventListener(
                "change",
                function() {

                    if (this.checked) {

                        localStorage.setItem(
                            watchedKey(index),
                            "true"
                        );

                        playSound(
                            movie[1]
                        );

                    }

                    else {

                        localStorage.removeItem(
                            watchedKey(index)
                        );

                    }

                    render();

                }
            );


            /* RATING */

            rating.addEventListener(
                "change",
                function() {

                    if (
                        this.value !== ""
                    ) {

                        localStorage.setItem(
                            ratingKey(index),
                            this.value
                        );

                    }

                    else {

                        localStorage.removeItem(
                            ratingKey(index)
                        );

                    }

                    updateStats();

                }
            );


            row.appendChild(
                checkbox
            );

            row.appendChild(
                dateElement
            );

            row.appendChild(
                title
            );

            row.appendChild(
                rating
            );


            franchiseBlock.appendChild(
                row
            );

        }
    );


    updateStats();

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

    let watched = 0;

    const ratings = [];


    movies.forEach(
        (_,index) => {

            if (
                localStorage.getItem(
                    watchedKey(index)
                ) === "true"
            ) {

                watched++;

            }


            const rating =
                parseFloat(
                    localStorage.getItem(
                        ratingKey(index)
                    )
                );


            if (!isNaN(rating)) {

                ratings.push(
                    rating
                );

            }

        }
    );


    const total =
        movies.length;


    const percent =
        Math.round(
            watched / total * 100
        );


    let average =
        "—";


    if (ratings.length) {

        const sum =
            ratings.reduce(
                (a,b) => a + b,
                0
            );

        average =
            (
                sum / ratings.length
            ).toFixed(1) +
            " / 10";

    }


    document.getElementById(
        "watched"
    ).textContent =
        watched + " / " + total;


    document.getElementById(
        "percentage"
    ).textContent =
        percent + "%";


    document.getElementById(
        "average"
    ).textContent =
        average;


    document.getElementById(
        "progressText"
    ).textContent =
        watched + " / " + total;


    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";

}


/* =========================================================
   RESET
========================================================= */

function resetProgress() {

    if (
        !confirm(
            "Reset your entire 2027 movie marathon?"
        )
    ) {
        return;
    }


    movies.forEach(
        (_,index) => {

            localStorage.removeItem(
                watchedKey(index)
            );

            localStorage.removeItem(
                ratingKey(index)
            );

        }
    );


    render();

}


/* =========================================================
   START
========================================================= */

render();

</script>
